<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Premier Dunk</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --card:#161616;
      --accent:#ff5a00;
      --text:#eee;
    }
    *{box-sizing:border-box; margin:0; padding:0;}

    body{
      background: var(--bg);
      background-image: radial-gradient(800px 400px at 85% -10%, #222, transparent);
      color: var(--text);
      font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .wrap{
      width: min(960px, 100%);
      display: grid;
      gap: 22px;
    }

    h1{
      text-align: center;
      font-size: clamp(1.5rem, 4.5vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), #ffaa66);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: .5px;
    }

    .grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 18px;
    }

    .card{
      background: var(--card);
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,.5);
      transition: transform .2s ease, border-color .2s ease;
    }
    .card:hover{
      transform: translateY(-3px);
      border-color: #3a3a3a;
    }

    .card figcaption{
      text-align: center;
      font-weight: 600;
      color: #bbb;
      margin-bottom: 10px;
    }

    video{
      width: 100%;
      height: auto;
      aspect-ratio: 350 / 450; /* Garde ton format */
      border-radius: 12px;
      background: #000;
      object-fit: cover; /* La vignette remplit sans se déformer */
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Passer son premier dunk</h1>

    <section class="grid">
      <figure class="card">
        <figcaption>Vidéo 1</figcaption>
        <video 
          src="détente.mp4" 
          poster="poster1.jpg" 
          controls 
          preload="metadata" 
          playsinline>
        </video>
      </figure>

      <figure class="card">
        <figcaption>Vidéo 2 : Tuto</figcaption>
        <video 
          src="COMMENT_PASSER_SON_PREMIER_DUNK_AU_BASKET__(360p).mp4" 
          poster="poster2.jpg" 
          controls 
          preload="metadata" 
          playsinline>
        </video>
      </figure>
    </section>
  </main>

  <script>
    // Règle: une seule vidéo joue à la fois
    const videos = document.querySelectorAll('video');

    videos.forEach(v => {
      v.addEventListener('play', () => {
        videos.forEach(other => {
          if (other !== v && !other.paused) {
            other.pause();
            other.currentTime = 0; // Enlève ça si tu veux juste pause
          }
        });
      });
    });
  </script>
</body>
</html>
